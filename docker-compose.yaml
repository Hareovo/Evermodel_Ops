# ============================================================================
# Evermodel Ops — 数据层与网关（单文件，放在仓库根目录）
#
#   mysql  mariadb 10.8   库 evermodel_ops，账号 root / evermodel_ops
#   redis  7-alpine      业务队列 + WebSocket channel layer（务必 AOF 持久化）
#   nginx  alpine        前端静态文件 + /api 反代到宿主机上的后端
#
#   后端 5 个进程**不在**本文件里：它们在宿主机 venv 中由 supervisor 托管
#   （见 deploy/supervisor/README.md）。这样做是为了便于二开调试，
#   也避免把 SSH 私钥塞进容器。
#
# 用法：
#   cp .env.example .env        # 生产环境务必改密码
#   docker compose up -d
#   docker compose ps
#
# 端口：
#   3306  mysql    可用 .env 的 EVERMODEL_MYSQL_PORT_MAP 改（宿主机已被占用时改 13306）
#   6379  redis
#   80    nginx
#
# ⚠️ 不要与 deploy-local/docker-compose.yml 同时启动 —— 容器名与端口相同，
#    它们是同一套栈的两种形态（本文件=标准形态，deploy-local=本机 Windows 开发形态）。
# ============================================================================
name: evermodel_ops

services:
  mysql:
    image: mariadb:10.8
    container_name: spug-mysql
    restart: unless-stopped
    ports:
      - "${EVERMODEL_MYSQL_PORT_MAP:-3306}:3306"
    environment:
      # 业务库名与 db/init.sql、backend/evermodel_ops/overrides.py 默认值保持一致
      MYSQL_DATABASE: evermodel_ops
      # ⚠️ 初始化默认密码就是 evermodel_ops（本项目约定的初始值）。
      #    生产环境请在 .env 里用 EVERMODEL_MYSQL_ROOT_PASSWORD 覆盖成强密码，
      #    并同步修改 backend/evermodel_ops/overrides.py（或同名环境变量）。
      #
      #    ⚠️ 改这里的变量对**已存在的数据卷无效** —— 镜像的 entrypoint 只在首次
      #       初始化数据卷时读这些变量。要换密码：docker compose down -v 后重建，
      #       或直接在库里执行 ALTER USER（见 db/README.md 第五节）。
      MYSQL_ROOT_PASSWORD: ${EVERMODEL_MYSQL_ROOT_PASSWORD:-evermodel_ops}
      # 放行 root 从任意主机连：后端在宿主机上，经端口映射进来的来源 IP 是网桥网关
      # （如 172.20.0.1），不匹配 root@'localhost'
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: spug-redis
    restart: unless-stopped
    ports:
      - "${EVERMODEL_REDIS_PORT_MAP:-6379}:6379"
    # AOF 持久化：批量执行的实时输出、监控检测的中间状态都在 redis 里，
    # 重启丢数据会出现「任务卡住不动」，别关。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:alpine
    container_name: spug-nginx
    restart: unless-stopped
    ports:
      - "${EVERMODEL_NGINX_PORT_MAP:-80}:80"
    volumes:
      - ./deploy/nginx/evermodel_ops.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端产物：开发机构建好（frontend/BUILD.md）后放进来即可，无需重建容器
      - ./frontend/build:/usr/share/nginx/html:ro
    extra_hosts:
      # 让容器内的 nginx 能访问宿主机上的 gunicorn(9001) / daphne(9002)
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
