# 前端静态文件由本容器提供，/api 反向代理到宿主机上命令行启动的 Django（0.0.0.0:8000）
#
# 【为什么不用直接写 host.docker.internal】
# Docker Desktop 会往容器的 /etc/hosts 里同时写入 host.docker.internal 的 IPv4 和 IPv6 两条记录：
#     192.168.65.254      host.docker.internal
#     fdc4:f303:9324::254 host.docker.internal
# nginx 静态解析上游域名时会优先拿到 IPv6，而容器 IPv6 出网不通，
# 结果就是 connect() to [fdc4:...]:8000 failed (101: Network unreachable) -> 前端 502 Bad Gateway。
# 所以这里改用 Docker 内置 DNS（127.0.0.11）+ ipv6=off，强制只解析 A 记录（IPv4）。
# 注意：一旦用变量做 proxy_pass，nginx 就不再查 /etc/hosts，只走 resolver。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80 default_server;
    server_name  _;
    root         /usr/share/nginx/html;
    client_max_body_size 100m;

    gzip  on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level  7;
    gzip_types       text/plain text/css text/javascript application/javascript application/json;
    gzip_vary on;

    # WebSocket：主机在线终端 / 部署控制台，走长连接，读超时放宽
    location ^~ /api/ws/ {
        # set 必须写在 rewrite 之前：rewrite 的 break 会终止后续 rewrite 模块指令（set 属于该模块）
        set $backend_upstream "host.docker.internal:8000";
        rewrite ^/api(.*) $1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/ {
        set $backend_upstream "host.docker.internal:8000";
        rewrite ^/api(.*) $1 break;
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 300s;
        proxy_redirect off;
        # 必须透传原始 Host，否则 Django 的 ALLOWED_HOSTS 校验会返回 400
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
