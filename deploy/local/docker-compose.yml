# Evermodel Ops 本地开发环境：只把 Windows 上不好装的依赖交给 Docker
#   mysql / redis -> 容器
#   nginx         -> 容器，提供前端静态文件 + 反向代理到宿主机上的 Django（8000）
#   后端 backend -> 宿主机 Python 命令行启动（便于二开调试）
#
# 用法：在本目录执行  docker compose up -d
name: spug-dev

services:
  mysql:
    image: mariadb:10.8
    container_name: spug-mysql
    restart: unless-stopped
    # 宿主机 3306 已被占用，这里映射到 13306，避免冲突
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: spug
      MYSQL_USER: spug
      MYSQL_PASSWORD: ${EVERMODEL_MYSQL_PASSWORD:?请把 .env.example 复制为 .env 并填写密码}
      MYSQL_ROOT_PASSWORD: ${EVERMODEL_MYSQL_ROOT_PASSWORD:?请把 .env.example 复制为 .env 并填写密码}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: spug-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:alpine
    container_name: spug-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端产物：二开时在 frontend 下执行 npm run build 覆盖该目录即可
      - ../../frontend/build:/usr/share/nginx/html:ro
    extra_hosts:
      # 让容器能访问宿主机上的 Django dev server
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
  redis_data:
