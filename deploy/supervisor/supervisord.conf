; ============================================================================
; Evermodel Ops — supervisord 主配置
;
; 由 systemd 以「前台」方式拉起（Type=simple + supervisord -n），
; 所以这里必须是 nodaemon=true：supervisord 自己不 fork 到后台，
; 进程生命周期完全交给 systemd 跟踪，退出即重启。
;
; 安装位置：/etc/evermodel_ops/supervisord.conf
; 安装方式见 deploy/supervisor/README.md 第二节，一般不需要改。
; ============================================================================

[unix_http_server]
; supervisorctl 通过这个 unix socket 和 supervisord 通信，不开放 TCP 端口
file = /run/evermodel_ops-supervisor.sock
chmod = 0700

[supervisord]
nodaemon = true
logfile = /var/log/evermodel_ops/supervisord.log
logfile_maxbytes = 50MB
logfile_backups = 10
loglevel = info
pidfile = /run/evermodel_ops-supervisord.pid
childlogdir = /var/log/evermodel_ops
; 5 个进程 + WebSocket 长连接会占不少 fd，这两个下限别调太低
minfds = 65535
minprocs = 4096
; 平台需要读主机 SSH 私钥、写仓库缓存，默认以当前用户（systemd 下即 root）运行
; user = root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/evermodel_ops-supervisor.sock

[include]
; 每个 .conf 里放一个或多个 [program:*]，本项目就是 evermodel_ops.conf 里的 5 个
files = /etc/evermodel_ops/conf.d/*.conf
