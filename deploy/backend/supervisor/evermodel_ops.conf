; ============================================================================
; Evermodel Ops — 5 个后端常驻进程
;
; 安装位置：/etc/evermodel_ops/conf.d/evermodel_ops.conf
;
; ⚠️ 本文件里的 __APP_DIR__ 是占位符，安装时替换成实际部署路径（默认 /data/evermodel_ops）：
;      sed 's|__APP_DIR__|/data/evermodel_ops|g' evermodel_ops.conf \
;        | sudo tee /etc/evermodel_ops/conf.d/evermodel_ops.conf
;    完整安装步骤见同目录 README.md 第二节。
;
; 后端不是单个进程，而是「1 REST API + 1 WebSocket + 3 异步执行器」：
;   evermodel_ops-api        gunicorn :9001  REST API
;   evermodel_ops-ws         daphne   :9002  WebSocket（主机终端、执行实时输出）
;   evermodel_ops-worker     manage.py runworker     批量执行 / 任务计划 / 监控 的执行器
;   evermodel_ops-monitor    manage.py runmonitor    监控检测
;   evermodel_ops-scheduler  manage.py runscheduler  任务计划调度
;
; ⚠️ 只起 api（+ws）平台能打开，但批量执行会卡在 Waiting for scheduling、
;    监控检查与任务计划完全不执行。5 个都要起。
;
; 真实执行的命令在 backend/tools/start-*.sh 里（脚本自己会 cd 到 backend/
; 并 source venv/bin/activate），这里只负责「由谁来拉起来、挂了怎么办、日志写哪」。
; ============================================================================

[program:evermodel_ops-api]
command = bash __APP_DIR__/backend/tools/start-api.sh
directory = __APP_DIR__/backend
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stopwaitsecs = 20
stopsignal = TERM
stdout_logfile = __APP_DIR__/backend/logs/api.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 5
redirect_stderr = true
environment = PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",EVERMODEL_MYSQL_DB="%(ENV_EVERMODEL_MYSQL_DB)s",EVERMODEL_MYSQL_USER="%(ENV_EVERMODEL_MYSQL_USER)s",EVERMODEL_MYSQL_PASSWORD="%(ENV_EVERMODEL_MYSQL_PASSWORD)s",EVERMODEL_MYSQL_HOST="%(ENV_EVERMODEL_MYSQL_HOST)s",EVERMODEL_MYSQL_PORT="%(ENV_EVERMODEL_MYSQL_PORT)s",EVERMODEL_REDIS_HOST="%(ENV_EVERMODEL_REDIS_HOST)s",EVERMODEL_REDIS_PORT="%(ENV_EVERMODEL_REDIS_PORT)s",EVERMODEL_DEBUG="%(ENV_EVERMODEL_DEBUG)s",EVERMODEL_ALLOWED_HOSTS="%(ENV_EVERMODEL_ALLOWED_HOSTS)s",EVERMODEL_SECRET_KEY="%(ENV_EVERMODEL_SECRET_KEY)s"

[program:evermodel_ops-ws]
command = bash __APP_DIR__/backend/tools/start-ws.sh
directory = __APP_DIR__/backend
autostart = true
autorestart = true
startsecs = 5
startretries = 3
; WebSocket 连接多，给足优雅退出时间
stopwaitsecs = 20
stopsignal = TERM
stdout_logfile = __APP_DIR__/backend/logs/ws.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 5
redirect_stderr = true
environment = PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",EVERMODEL_MYSQL_DB="%(ENV_EVERMODEL_MYSQL_DB)s",EVERMODEL_MYSQL_USER="%(ENV_EVERMODEL_MYSQL_USER)s",EVERMODEL_MYSQL_PASSWORD="%(ENV_EVERMODEL_MYSQL_PASSWORD)s",EVERMODEL_MYSQL_HOST="%(ENV_EVERMODEL_MYSQL_HOST)s",EVERMODEL_MYSQL_PORT="%(ENV_EVERMODEL_MYSQL_PORT)s",EVERMODEL_REDIS_HOST="%(ENV_EVERMODEL_REDIS_HOST)s",EVERMODEL_REDIS_PORT="%(ENV_EVERMODEL_REDIS_PORT)s",EVERMODEL_DEBUG="%(ENV_EVERMODEL_DEBUG)s",EVERMODEL_ALLOWED_HOSTS="%(ENV_EVERMODEL_ALLOWED_HOSTS)s",EVERMODEL_SECRET_KEY="%(ENV_EVERMODEL_SECRET_KEY)s"

