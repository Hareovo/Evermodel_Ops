# ============================================================================
# Evermodel Ops — nginx 站点配置（容器内版本）
#
# 由同级的 deploy/middleware/docker-compose.yaml 挂载到 /etc/nginx/conf.d/default.conf
#
# 上游是**宿主机**上的后端 5 个进程（由 supervisor 托管，见 deploy/backend/supervisor/）：
#   /api/ws/  ->  daphne   :9002   WebSocket（主机终端、批量执行实时输出）
#   /api/     ->  gunicorn :9001   REST API
#
# 容器内这两个地址写作 host.docker.internal —— compose 里用
# extra_hosts: ["host.docker.internal:host-gateway"] 把它指向宿主机；
# 若改用宿主机 nginx（不用 nginx 容器），把 host.docker.internal 换成 127.0.0.1 即可。
# ============================================================================

server {
    listen       80 default_server;
    server_name  _;                                 # 有域名就填域名

    root         /usr/share/nginx/html;             # = frontend/build
    index        index.html;
    client_max_body_size 100m;

    # 访问日志带上上游地址与响应时间，排查 502 时有用
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip  on;
    gzip_min_length   1k;
    gzip_buffers      4 16k;
    gzip_http_version 1.1;
    gzip_comp_level   7;
    gzip_types        text/plain text/css text/javascript application/javascript application/json;
    gzip_vary on;

    # ------------------------------------------------------------------
    # WebSocket：主机在线终端 / 批量执行输出。长连接，读超时放宽到 1 小时。
    #
    # ⚠️ 必须透传 Host 与 X-Real-IP：
    #    - 后端的 ALLOWED_HOSTS 校验依赖 Host
    #    - WebSocket 鉴权除了 query 里的 x-token，还会校验 X-Real-IP
    #    - Upgrade / Connection 两个头不转发，握手直接 400
    # ------------------------------------------------------------------
    location ^~ /api/ws/ {
        access_log off;
        rewrite ^/api(.*) $1 break;
        proxy_pass http://host.docker.internal:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # REST API：nginx 剥掉 /api 前缀后转给 gunicorn
    # ------------------------------------------------------------------
    location ^~ /api/ {
        rewrite ^/api(.*) $1 break;
        proxy_pass http://host.docker.internal:9001;
        proxy_read_timeout 300s;
        proxy_redirect off;
        # 必须透传原始 Host，否则 Django 的 ALLOWED_HOSTS 校验会返回 400 DisallowedHost
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的静态资源：文件名一变就是新 URL，可以长期缓存
    # ------------------------------------------------------------------
    location ^~ /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 单页应用：找不到的路径一律回退到 index.html
    # index.html 绝不能缓存 —— 它引用的是带哈希的 chunk，
    # 缓存住会出现「换了产物但页面还是旧的」
    # ------------------------------------------------------------------
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
